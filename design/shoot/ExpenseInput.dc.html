<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="width:340px;height:734px;overflow:hidden;">
<div style="height:100%;box-sizing:border-box;background:#F6F5FC;display:flex;flex-direction:column;">
          <div style="padding:60px 20px 20px;text-align:center;background:#F0EEFF;flex-shrink:0;">
            <div style="font-size:12px;font-weight:700;color:#6B6980;">지출 금액</div>
            <div style="display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:6px;">
              <span style="font-size:22px;font-weight:800;color:#6B6980;">₩</span>
              <span style="font-size:36px;font-weight:800;color:#2D2A3E;letter-spacing:-1px;">12,500</span>
            </div>
          </div>
          <div style="flex:1;overflow:auto;padding:18px 20px 28px;">

            <div style="font-size:12px;font-weight:700;color:#6B6980;margin-bottom:8px;">선택한 그룹에 맞는 카테고리예요</div>
            <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:8px;">카테고리</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <sc-for list="{{ expenseCategories }}" as="cat" hint-placeholder-count="6">
                <div onClick="{{ cat.onSelect }}" style="padding:9px 13px;border-radius:14px;font-size:13px;font-weight:800;background:{{ cat.bg }};color:{{ cat.color }};border:2px solid {{ cat.border }};cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:{{ cat.shadow }};">
                  <sc-if value="{{ cat.isFood }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg></sc-if>
                  <sc-if value="{{ cat.isTransport }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg></sc-if>
                  <sc-if value="{{ cat.isLiving }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></sc-if>
                  <sc-if value="{{ cat.isCulture }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 1 0 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 1 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg></sc-if>
                  <sc-if value="{{ cat.isMedical }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg></sc-if>
                  <sc-if value="{{ cat.isDate }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></sc-if>
                  <sc-if value="{{ cat.isGift }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"></path></svg></sc-if>
                  <sc-if value="{{ cat.isAnniversary }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></sc-if>
                  <sc-if value="{{ cat.isTrip }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1 .1-1.3.5l-.7.9c-.3.4-.2.9.2 1.2L9 12l-2 3H4l-1.5 1.5c-.3.3-.3.7 0 1l1.5 1.5h.9v-2l1.5-1.5 3 6.5c.3.4.8.5 1.2.2l.9-.7c.4-.3.6-.8.5-1.3z"></path></svg></sc-if>
                  <sc-if value="{{ cat.isCafe }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg></sc-if>
                  <sc-if value="{{ cat.isEducation }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></sc-if>
                  <sc-if value="{{ cat.isManagement }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg></sc-if>
                  <sc-if value="{{ cat.isTelecom }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.732 1.598l-.464.355a1 1 0 0 0-.302 1.214 14.11 14.11 0 0 0 6.331 6.33z"></path></svg></sc-if>
                  <sc-if value="{{ cat.isCustom }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></sc-if>
                  <sc-if value="{{ cat.isEtc }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ cat.color }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></sc-if>
                  {{ cat.label }}
                </div>
              </sc-for>
            </div>

            <sc-if value="{{ showCustomCategoryInput }}" hint-placeholder-val="{{ false }}">
              <input type="text" placeholder="카테고리 이름을 입력하세요" style="width:100%;box-sizing:border-box;height:44px;border-radius:14px;border:2px solid #6A5ECF;background:#fff;padding:0 14px;font-size:14px;font-weight:600;color:#2D2A3E;margin-top:10px;">
            </sc-if>

            <div style="margin-top:18px;">
              <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:8px;">메모</div>
              <input type="text" placeholder="예) 스타벅스 카페라떼" style="width:100%;box-sizing:border-box;height:46px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;padding:0 16px;font-size:14px;color:#2D2A3E;font-weight:600;">
            </div>
            <div style="margin-top:14px;">
              <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:8px;">날짜</div>
              <div style="height:46px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:14px;font-weight:600;color:#2D2A3E;">2026년 9월 9일</div>
            </div>
            <div style="margin-top:14px;">
              <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:8px;">어느 그룹과 공유할까요?</div>
              <select value="{{ shareGroupValue }}" onChange="{{ onShareGroupChange }}" style="width:100%;box-sizing:border-box;height:46px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;padding:0 14px;font-size:14px;font-weight:600;color:#2D2A3E;">
                <option value="none">공유 안 함</option>
                <option value="couple">민준 &amp; 서연</option>
                <option value="family">행복한 우리집</option>
                <option value="roommate">전세 405호</option>
              </select>
            </div>
            <div style="margin-top:22px;height:50px;border-radius:16px;background:linear-gradient(135deg,#E3DFFB 0%,#BDB2F2 100%);color:#3F3480;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 8px 18px rgba(106,94,207,0.3);">저장하기</div>
          </div>

          <div style="flex-shrink:0;padding:10px 12px 20px;background:#fff;border-top:1px solid #ECE9E3;display:flex;align-items:center;">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">홈</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">그룹</div>
            </div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;">
              <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8C81E0 0%,#6A5ECF 100%);display:flex;align-items:center;justify-content:center;">
                <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
              </div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"></line><line x1="8" x2="21" y1="12" y2="12"></line><line x1="8" x2="21" y1="18" y2="18"></line><line x1="3" x2="3.01" y1="6" y2="6"></line><line x1="3" x2="3.01" y1="12" y2="12"></line><line x1="3" x2="3.01" y1="18" y2="18"></line></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">지출내역</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">마이페이지</div>
            </div>
          </div>
        </div>
</div>
</x-dc>
<script data-dc-script>
const DEFAULT_CATS = [
  { id: 'food', label: '식비', accent: '#F5A882', light: '#FFF2EC', ink: '#A15A1E', icon: 'food' },
  { id: 'transport', label: '교통', accent: '#89C4F4', light: '#EBF5FF', ink: '#2E7AB8', icon: 'transport' },
  { id: 'living', label: '생활용품', accent: '#6FC5BA', light: '#E8F9F7', ink: '#1D7A69', icon: 'living' },
  { id: 'etc', label: '기타', accent: '#F5D485', light: '#FFFBE8', ink: '#8A6A12', icon: 'etc' },
];

const FAMILY_CATS = [
  { id: 'food', label: '식비', accent: '#F5A882', light: '#FFF2EC', ink: '#A15A1E', icon: 'food' },
  { id: 'living', label: '생활용품', accent: '#6FC5BA', light: '#E8F9F7', ink: '#1D7A69', icon: 'living' },
  { id: 'education', label: '교육비', accent: '#89C4F4', light: '#EBF5FF', ink: '#2E7AB8', icon: 'education' },
  { id: 'medical', label: '의료비', accent: '#F0A8C0', light: '#FFF0F6', ink: '#C24C77', icon: 'medical' },
  { id: 'management', label: '관리비', accent: '#C9BFAE', light: '#F3F0E9', ink: '#7A6E52', icon: 'management' },
  { id: 'telecom', label: '통신비', accent: '#9FD1C7', light: '#EAF7F3', ink: '#1F6F5C', icon: 'telecom' },
  { id: 'culture', label: '여가문화', accent: '#B8ADEC', light: '#F0EEFF', ink: '#6A5ECF', icon: 'culture' },
  { id: 'etc', label: '기타', accent: '#F5D485', light: '#FFFBE8', ink: '#8A6A12', icon: 'etc' },
];

const COUPLE_CATS = [
  { id: 'date', label: '데이트', accent: '#F0A8C0', light: '#FFF0F6', ink: '#C24C77', icon: 'date' },
  { id: 'gift', label: '선물', accent: '#B8ADEC', light: '#F0EEFF', ink: '#6A5ECF', icon: 'gift' },
  { id: 'anniversary', label: '기념일', accent: '#F5D485', light: '#FFFBE8', ink: '#8A6A12', icon: 'anniversary' },
  { id: 'trip', label: '여행', accent: '#89C4F4', light: '#EBF5FF', ink: '#2E7AB8', icon: 'trip' },
  { id: 'cafe', label: '카페·식사', accent: '#F5A882', light: '#FFF2EC', ink: '#A15A1E', icon: 'cafe' },
  { id: 'etc', label: '기타', accent: '#6FC5BA', light: '#E8F9F7', ink: '#1D7A69', icon: 'etc' },
];

function groupToCats(shareGroup) {
  if (shareGroup === 'couple') return COUPLE_CATS;
  if (shareGroup === 'family') return FAMILY_CATS;
  return DEFAULT_CATS;
}

class Component extends DCLogic {
  state = {
    shareGroup: 'couple',
    selectedExpenseCategory: 'date',
  };

  buildExpenseCategories() {
    const list = groupToCats(this.state.shareGroup).concat([
      { id: 'custom', label: '직접 입력', accent: '#A9A2B8', light: '#F1EFEC', ink: '#5B5568', icon: 'custom' },
    ]);
    return list.map(c => {
      const sel = this.state.selectedExpenseCategory === c.id;
      return {
        id: c.id,
        label: c.label,
        bg: sel ? c.light : '#FFFFFF',
        border: sel ? c.accent : '#E8E4F4',
        color: c.ink,
        shadow: sel ? '0 4px 12px ' + c.accent + '55' : 'none',
        isFood: c.icon === 'food',
        isTransport: c.icon === 'transport',
        isLiving: c.icon === 'living',
        isCulture: c.icon === 'culture',
        isMedical: c.icon === 'medical',
        isEtc: c.icon === 'etc',
        isDate: c.icon === 'date',
        isGift: c.icon === 'gift',
        isAnniversary: c.icon === 'anniversary',
        isTrip: c.icon === 'trip',
        isCafe: c.icon === 'cafe',
        isEducation: c.icon === 'education',
        isManagement: c.icon === 'management',
        isTelecom: c.icon === 'telecom',
        isCustom: c.icon === 'custom',
        onSelect: () => this.setState({ selectedExpenseCategory: c.id }),
      };
    });
  }

  renderVals() {
    return {
      expenseCategories: this.buildExpenseCategories(),
      showCustomCategoryInput: this.state.selectedExpenseCategory === 'custom',
      shareGroupValue: this.state.shareGroup,
      onShareGroupChange: e => {
        const g = e.target.value;
        this.setState({ shareGroup: g, selectedExpenseCategory: groupToCats(g)[0].id });
      },
    };
  }
}
</script>
</body>
</html>
