<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="width:340px;height:734px;overflow:hidden;">
<div style="height:100%;box-sizing:border-box;background:#F6F5FC;display:flex;flex-direction:column;">
          <div style="padding:60px 24px 26px;text-align:center;background:#F0EEFF;">
            <div style="width:56px;height:56px;border-radius:16px;background:#6A5ECF;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
              <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" x2="3" y1="12" y2="12"></line></svg>
            </div>
            <div style="font-size:20px;font-weight:800;color:#2D2A3E;">다시 만나서 반가워요</div>
            <div style="font-size:13px;color:#6B6980;margin-top:6px;font-weight:600;">로그인하고 가계부를 확인해보세요</div>
          </div>
          <div style="flex:1;padding:24px 24px 32px;display:flex;flex-direction:column;">
            <div style="display:flex;flex-direction:column;gap:14px;">
              <div>
                <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:7px;">이메일</div>
                <input type="email" placeholder="you@email.com" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;padding:0 16px;font-size:14px;font-weight:600;color:#2D2A3E;">
              </div>
              <div>
                <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:7px;">비밀번호</div>
                <input type="password" placeholder="비밀번호" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;padding:0 16px;font-size:14px;font-weight:600;color:#2D2A3E;">
              </div>
            </div>
            <div onClick="{{ toggleKeepLoggedIn }}" style="display:flex;align-items:center;gap:10px;margin-top:18px;cursor:pointer;">
              <div style="width:42px;height:24px;border-radius:12px;background:{{ keepLoggedInTrackColor }};position:relative;transition:background 0.15s;">
                <div style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:{{ keepLoggedInThumbPos }};box-shadow:0 2px 5px rgba(0,0,0,0.2);transition:left 0.15s;"></div>
              </div>
              <div style="font-size:13px;color:#2D2A3E;font-weight:700;">로그인 상태 유지</div>
            </div>
            <div style="margin-top:20px;height:50px;border-radius:16px;background:linear-gradient(135deg,#E3DFFB 0%,#BDB2F2 100%);color:#3F3480;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 8px 18px rgba(106,94,207,0.3);">로그인</div>
            <div style="flex:1;"></div>
            <div style="text-align:center;font-size:13px;color:#6B6980;font-weight:600;">계정이 없으신가요? <span style="color:#6A5ECF;font-weight:800;">회원가입</span></div>
          </div>
        </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  state = {
    keepLoggedIn: true,
  };
  renderVals() {
    return {
      keepLoggedIn: this.state.keepLoggedIn,
      toggleKeepLoggedIn: () => this.setState(s => ({ keepLoggedIn: !s.keepLoggedIn })),
      keepLoggedInTrackColor: this.state.keepLoggedIn ? '#6A5ECF' : '#D8D3C8',
      keepLoggedInThumbPos: this.state.keepLoggedIn ? '21px' : '3px',
    };
  }
}
</script>
</body>
</html>
