<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="width:340px;height:734px;overflow:hidden;">
<div style="height:100%;box-sizing:border-box;background:#F6F5FC;display:flex;flex-direction:column;">
          <div style="padding:60px 20px 12px;flex-shrink:0;display:flex;align-items:center;gap:10px;">
            <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2D2A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
            <div style="flex:1;font-size:18px;font-weight:800;color:#2D2A3E;">수입 내역</div>
            <a href="#income-edit" style="width:32px;height:32px;border-radius:50%;background:#6A5ECF;display:flex;align-items:center;justify-content:center;">
              <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg>
            </a>
          </div>

          <div style="flex:1;overflow:auto;padding:10px 20px 24px;">
            <div style="background:#fff;border:1.5px solid #E8E4F4;border-radius:20px;padding:20px;text-align:center;margin-bottom:16px;">
              <div style="font-size:12px;font-weight:700;color:#6B6980;">2026년 9월 총 수입</div>
              <div style="font-size:28px;font-weight:800;color:#1D7A69;margin-top:6px;letter-spacing:-0.5px;">{{ totalIncomeLabel }}</div>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px;">
              <div style="background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:1px solid #E8E4F4;">
                <div style="width:34px;height:34px;border-radius:12px;background:#E8F9F7;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#1D7A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="19" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:13px;font-weight:800;color:#2D2A3E;">9월 월급</div>
                  <div style="font-size:11px;color:#6B6980;font-weight:600;">급여 · 9월 1일</div>
                </div>
                <div style="font-size:14px;font-weight:800;color:#1D7A69;">2,400,000원</div>
              </div>
            </div>
          </div>
        </div>
</div>
</x-dc>
<script data-dc-script data-props='{"totalIncome":{"editor":"number","default":2400000,"section":"수입"}}'>
class Component extends DCLogic {
  renderVals() {
    const totalIncome = this.props.totalIncome ?? 2400000;
    return {
      totalIncomeLabel: totalIncome.toLocaleString('ko-KR') + '원',
    };
  }
}
</script>
</body>
</html>
