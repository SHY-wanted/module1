<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="width:340px;height:734px;overflow:hidden;">
<div style="height:100%;box-sizing:border-box;background:#F6F5FC;display:flex;flex-direction:column;">
          <div style="flex:1;overflow:auto;padding:60px 20px 20px;">
          <div style="font-size:22px;font-weight:800;color:#2D2A3E;">지출 내역</div>
          <sc-for list="{{ expenseMonths }}" as="mo" hint-placeholder-count="2">
            <div style="margin-top:18px;">
              <div style="font-size:13px;font-weight:800;color:#6B6980;margin-bottom:8px;">{{ mo.month }}</div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <sc-for list="{{ mo.items }}" as="it" hint-placeholder-count="3">
                  <div style="background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;border:{{ it.rowBorder }};box-shadow:{{ it.rowShadow }};">
                    <div style="width:36px;height:36px;border-radius:12px;background:{{ it.catAccent }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                      <sc-if value="{{ it.isFood }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg></sc-if>
                      <sc-if value="{{ it.isTransport }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg></sc-if>
                      <sc-if value="{{ it.isLiving }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></sc-if>
                      <sc-if value="{{ it.isCulture }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 1 0 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 1 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg></sc-if>
                    </div>
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                        <div style="font-size:14px;font-weight:800;color:#2D2A3E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;">{{ it.merchant }}</div>
                        <sc-if value="{{ it.needsReview }}" hint-placeholder-val="{{ false }}">
                          <div style="font-size:10px;font-weight:800;color:#A15A1E;background:#FFF2EC;padding:2px 7px;border-radius:8px;border:1px solid rgba(245,168,130,0.5);white-space:nowrap;flex-shrink:0;">확인 필요</div>
                        </sc-if>
                      </div>
                      <div style="font-size:12px;color:#6B6980;margin-top:2px;font-weight:600;">{{ it.category }} · {{ it.group }} · {{ it.time }}</div>
                    </div>
                    <div style="font-size:15px;font-weight:800;color:#2D2A3E;white-space:nowrap;">{{ it.amountLabel }}</div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
          </div>

          <div style="flex-shrink:0;padding:10px 12px 20px;background:#fff;border-top:1px solid #ECE9E3;display:flex;align-items:center;">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">홈</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">그룹</div>
            </div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;">
              <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8C81E0 0%,#6A5ECF 100%);display:flex;align-items:center;justify-content:center;">
                <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
              </div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6A5ECF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"></line><line x1="8" x2="21" y1="12" y2="12"></line><line x1="8" x2="21" y1="18" y2="18"></line><line x1="3" x2="3.01" y1="6" y2="6"></line><line x1="3" x2="3.01" y1="12" y2="12"></line><line x1="3" x2="3.01" y1="18" y2="18"></line></svg>
              <div style="font-size:10px;font-weight:700;color:#6A5ECF;">지출내역</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9A2B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
              <div style="font-size:10px;font-weight:700;color:#A9A2B8;">마이페이지</div>
            </div>
          </div>
        </div>
</div>
</x-dc>
<script data-dc-script>
const EXPENSE_MONTHS_BASE = [
  {
    month: '2026년 9월',
    items: [
      { merchant: '스타벅스 강남점', category: '식비', catAccent: '#F5A882', isFood: true, amount: 5800, group: '민준 & 서연', needsReview: true, time: '오늘 08:32' },
      { merchant: 'GS25', category: '생활', catAccent: '#6FC5BA', isLiving: true, amount: 12300, group: '전세 405호', needsReview: false, time: '9월 8일' },
      { merchant: 'CGV 왕십리', category: '문화', catAccent: '#B8ADEC', isCulture: true, amount: 28000, group: '민준 & 서연', needsReview: false, time: '9월 6일' },
      { merchant: '올리브영', category: '생활', catAccent: '#6FC5BA', isLiving: true, amount: 34500, group: '공유 안 함', needsReview: true, time: '9월 5일' },
    ],
  },
  {
    month: '2026년 8월',
    items: [
      { merchant: '이마트', category: '생활', catAccent: '#6FC5BA', isLiving: true, amount: 87200, group: '행복한 우리집', needsReview: false, time: '8월 29일' },
      { merchant: '택시', category: '교통', catAccent: '#89C4F4', isTransport: true, amount: 9600, group: '공유 안 함', needsReview: false, time: '8월 27일' },
    ],
  },
];

class Component extends DCLogic {
  renderVals() {
    const expenseMonths = EXPENSE_MONTHS_BASE.map(mo => ({
      month: mo.month,
      items: mo.items.map(it => ({
        ...it,
        rowBorder: it.needsReview ? '2px solid rgba(245,168,130,0.6)' : '1px solid #E8E4F4',
        rowShadow: it.needsReview ? '0 4px 14px rgba(245,168,130,0.2)' : '0 2px 8px rgba(45,42,62,0.05)',
        amountLabel: it.amount.toLocaleString('ko-KR') + '원',
      })),
    }));
    return { expenseMonths };
  }
}
</script>
</body>
</html>
