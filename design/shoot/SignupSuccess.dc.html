<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="width:340px;height:734px;overflow:hidden;">
<div style="height:100%;box-sizing:border-box;background:#F6F5FC;display:flex;flex-direction:column;">
          <div style="padding:60px 24px 26px;text-align:center;background:#F0EEFF;">
            <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#8C81E0 0%,#6A5ECF 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
              <svg width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
            </div>
            <div style="font-size:22px;font-weight:800;color:#2D2A3E;">시작해볼까요?</div>
            <div style="font-size:13px;color:#6B6980;margin-top:6px;font-weight:600;">함께 쓰고, 함께 확인해요</div>
          </div>
          <div style="flex:1;padding:24px 24px 32px;display:flex;flex-direction:column;">
            <div style="display:flex;flex-direction:column;gap:14px;">
              <div>
                <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:7px;">이메일</div>
                <input type="email" placeholder="you@email.com" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;padding:0 16px;font-size:14px;font-weight:600;color:#2D2A3E;">
              </div>
              <div>
                <div style="font-size:13px;font-weight:700;color:#2D2A3E;margin-bottom:7px;">비밀번호</div>
                <input type="password" placeholder="8자 이상" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:2px solid #E8E4F4;background:#fff;padding:0 16px;font-size:14px;font-weight:600;color:#2D2A3E;">
              </div>
            </div>
            <div style="margin-top:22px;height:50px;border-radius:16px;background:linear-gradient(135deg,#E3DFFB 0%,#BDB2F2 100%);color:#3F3480;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 8px 18px rgba(106,94,207,0.3);">가입하기</div>
            <div style="margin-top:12px;background:#2D2A3E;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:8px;">
              <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#9FE0CB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span style="font-size:13px;font-weight:700;color:#fff;">회원가입 성공했습니다!</span>
            </div>
            <div style="flex:1;"></div>
            <div style="text-align:center;font-size:13px;color:#6B6980;font-weight:600;">이미 계정이 있으신가요? <span style="color:#6A5ECF;font-weight:800;">로그인</span></div>
          </div>
        </div>
</div>
</x-dc>
</body>
</html>
